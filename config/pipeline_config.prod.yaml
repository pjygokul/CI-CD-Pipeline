environment: prod
app_name: "CustomerOrderETL"
version: "1.0.0"

extract:
  source_type: "s3"
  raw_data_path: "s3://prod-lakehouse-raw/transactions/latest/"
  s3_bucket: "prod-lakehouse-raw"
  batch_size: 50000

transform:
  base_currency: "USD"
  fx_rates:
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    CAD: 0.74
    INR: 0.012
  anomaly_std_threshold: 2.5
  loyalty_tiers:
    bronze_max: 500
    silver_max: 2000
    gold_min: 2000

validation:
  strict_mode: true
  max_error_percentage: 0.0
  required_columns:
    - transaction_id
    - customer_id
    - amount
    - currency
    - timestamp
    - status

load:
  target_type: "parquet"
  output_path: "s3://prod-analytics-lakehouse/curated/customer_orders/"
  partition_cols:
    - "transaction_year"
    - "transaction_month"
