name: Data Pipeline CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - dev
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 120
          flake8 src tests --count --max-line-length=120 --statistics

      - name: Check code formatting with Black
        run: |
          black --check src tests

  unit-and-mock-tests:
    name: Unit & Mock Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=src/pipeline --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  pipeline-dry-run:
    name: End-to-End Pipeline Dry Run
    runs-on: ubuntu-latest
    needs: unit-and-mock-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pipeline in Dev Mode
        run: |
          python scripts/run_pipeline.py --env dev
